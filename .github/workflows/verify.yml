# verify: the push-side gate, and the one workflow that produces verdi's
# self-hosted CI evidence (the "verdi-evidence" artifact).
#
# Parallel shape (SI-267, owner directive 2026-09-25: "parallelize it like
# merge-gate"). The first six jobs below are merge-gate.yml's gate jobs,
# copied unchanged: static, test-cmd, test-cross, test-rest, spec-align, e2e.
# SI-266 split `make verify`'s step set, plus the post-verify self-lint,
# across those jobs so the wall clock is the slowest job, not the sum;
# merge-gate.yml's head comment says what each job runs and why. Trust parity
# (CLAUDE.md) holds here the way SI-266 records it for merge-gate.yml: CI runs
# exactly `make verify`'s step set, split across the gate jobs, and that set
# grows only as the Makefile's VERIFY_STEPS grows. A seventh job, `verify`,
# produces and uploads the evidence once every gate job has succeeded (see
# "The evidence job" below).
#
# The self-lint (Phase 4). `make verify`'s own `lint-store` target already
# runs `verdi lint` against this repo locally (no CI environment), which is
# enough to prove the binary and the store both lint clean. The static job's
# final two steps build the binary and run `verdi lint` again, in the real
# GitHub Actions environment, which additionally exercises I-14's CI-context
# lint baselines (VL-004's default-branch gate, VL-010's diff base). Task 8
# (spec/merge-signaled-acceptance) removed this workflow's own `pull_request`
# trigger, so here it runs on push, without a base ref; exercising those
# baselines against a real GITHUB_BASE_REF on pull_request events is
# merge-gate.yml's job.
#
# Setup lives in the gate job that needs it, exactly as in merge-gate.yml.
# The e2e job installs Node before `make e2e`, which is a HARD FAILURE without
# Node (wave 7: CLAUDE.md's testing regime made e2e a merge blocker), keeping
# local/CI parity real rather than nominal. The static job caches and installs
# golangci-lint at the Makefile's pin before `make lint`, so the lint step
# gates for real (the lint target hard-fails when CI=true and the binary is
# absent). pages.yml only builds the dex site (no lint), so it needs no linter.
#
# What internal/specalign enforces here (verifyworkflow_test.go, SI-267). The
# gate jobs must equal merge-gate.yml's in every key and value: the guard
# compares the decoded job trees, so a changed or dropped or reordered step,
# an added `env:`, `if:`, `timeout-minutes:`, or `with:` entry, or a missing or
# extra job fails it, on either side. YAML comments are not compared. This
# replaces the former review-only lockstep obligation between the two files
# with an automated one: change a gate job in merge-gate.yml and the guard
# fails until this file carries the same change. The same guard pins the
# `verify` job's keys, its `needs:`, and its exact steps, and this document's
# top-level keys (name, on, jobs); workflow_test.go's
# TestGolangciLintPinIsLockstepWithMakefile still ties the golangci-lint pin
# to the Makefile's GOLANGCI_LINT_VERSION. What stays a review obligation is
# the `on:` block, which differs from merge-gate.yml's on purpose (the
# path-filtered push trigger with its close/** carve-out and tag rule, and
# workflow_call; see below); close_workflow_test.go pins those parts of it.
#
# Phase 4 (spec-only vs code CI differentiation): path-filtered to code
# paths only. Originally this filter routed PRs too (a spec/doc-only PR got
# spec-gate.yml's fast check instead, a code PR got this one, a PR touching
# both got both workflows). Task 8 (spec/merge-signaled-acceptance) removed
# this workflow's `pull_request` trigger entirely: PRs are now gated
# exclusively by merge-gate.yml, which runs unconditionally on every PR with
# no path filter at all (a path-filtered required check can never report on
# a PR outside its paths — see merge-gate.yml's own head comment). This
# filter now governs push-only evidence routing: a push touching only these
# code paths triggers this workflow's gate jobs and evidence-bundle
# production; a push touching only spec/doc paths gets spec-gate.yml's
# push-side check instead.
#
# Round 6 (spec/close-verb ac-3, dc-1): this workflow ALSO does what the
# formerly-separate verdi-evidence.yml workflow did (produce + upload the
# "verdi-evidence" artifact), folded in as its final `verify` job. Why folded
# in rather than left as its own workflow:
#
#   - The self-hosted evidence producer (cmd/verdi/selfevidence.go) binds
#     verdi's own gate outcome as static/behavioral evidence, and its honesty
#     rests entirely on being invoked only after that gate already passed at
#     the same commit — never a second, independent gate run that could
#     disagree with the real (blocking) gate. Round 6 read that as "strictly
#     AFTER `make verify` exited 0 in the SAME job". SI-267 reads it as "in the
#     SAME workflow run, at the same commit, after every gate job of that run
#     succeeded", which is still the gate's own result. A separate workflow
#     either re-runs the gate itself (a forbidden divergent re-run — see
#     selfevidence.go's package doc) or requires fragile cross-workflow
#     signaling (workflow_run, artifact hand-off) just to learn "did the other
#     workflow's gate pass yet". Inside one run, `needs:` is that signal.
#   - Two workflows both uploading an artifact literally named
#     "verdi-evidence" for the same commit is itself ambiguous:
#     internal/forge/github's FetchEvidenceBundle tries every successful run
#     for a commit IN API ORDER until one carries that artifact name — with
#     two candidates it would silently pick whichever the API happens to
#     list first, not "the real one".
#
# The evidence job (SI-267). `verify` needs every gate job and declares no
# `if:` and no `continue-on-error:`, so GitHub's default success() skips it
# unless every gate job of this run succeeded: a failed, cancelled, or
# skipped gate job means no evidence from this run. It then passes every gate
# job's result to scripts/merge-gate-verdict.sh, the same call merge-gate.yml's
# `merge-gate` job makes. That step is defense in depth and a legible in-log
# witness of the results the evidence binds; it needs no canary, because the
# job cannot run over a failed need. Only then does it build the binary, run
# `verdi sync --produce`, and upload the bundle.
#
# Disclosed consequence (a deviation from remote-and-ci's original
# two-workflow delivery, flagged for `verdi align`/`verdi accept`
# disposition): evidence production is now path-filtered exactly like this
# workflow (verify.yml's own `paths:` below), not unconditional on every push
# the way the old verdi-evidence.yml was. This repo has no flowmap services
# (D6-4) — the self-hosted records are the ONLY evidence content this
# store's bundle has ever carried — and they are inherently code-outcome
# scoped, so a doc/spec-only commit producing no fresh evidence is honest,
# not a regression: the fold's ancestor-based "current" rule (03 §The fold)
# means an earlier code commit's evidence stays valid until a newer one
# supersedes it. verdi-evidence.yml is retired; its content lives here now.
#
# R-CM-4 (docs/superpowers/plans/2026-09-22-closing-machinery.md; spec/
# remote-and-ci DC-1): close/** branches must get evidence for their EXACT
# checked-out commit with NO path filter (03 §Closure ritual's closure gate
# folds only source: ci records, and a path-filtered miss on the commit
# being closed would leave it nothing fresh to fold, whatever that commit
# changed). GitHub Actions cannot express "path-filtered everywhere except
# close/**, unfiltered on close/**" inside ONE push trigger — a single
# `on: push:` block's `branches`/`paths` filters apply uniformly to every
# ref they match. So this workflow's OWN push trigger below EXCLUDES
# close/** via `branches-ignore` (every other branch keeps today's exact
# path-filtered behaviour, and `tags: ["**"]` keeps every tag push running
# this workflow as before), and a second, tiny workflow —
# close-evidence.yml, push-triggered on close/** ONLY, with no paths:
# filter at all — calls this workflow through `workflow_call` (the
# `workflow_call:` trigger in `on:` below) instead of duplicating its jobs.
# Reusing the SAME jobs this way, rather than copying them into a second
# file, keeps the self-hosted evidence producer (cmd/verdi/selfevidence.go)
# bound to the gate jobs of its own run — exactly the "never a second,
# independent run" invariant the Round 6 paragraph above established.
#
# What the carve-out prevents, and what it does not: one push to a close/**
# branch runs this workflow once, through close-evidence.yml, never also
# through this file's own push trigger. It does not make two
# "verdi-evidence" bundles for one commit impossible. The same commit can
# also be pushed to another branch or a tag where this workflow runs, and
# each such run uploads its own bundle. internal/forge/github's
# FetchEvidenceBundle finds runs by head_sha alone and takes the first
# successful run, in API order, that carries the artifact (the ambiguity
# named in the Round 6 paragraph). Every such bundle comes from this same
# workflow definition over the same commit and is source: ci, so whichever
# one it takes carries the same authority; which one it takes is not
# defined. In close.yml's sequence the commit being closed is a new commit
# pushed only to its close branch, so it normally has one bundle.
#
# GITHUB_JOB: the construction relies on GITHUB_JOB being `verify` inside
# the evidence job, including when close-evidence.yml calls this workflow.
# GITHUB_JOB feeds the evidence records' `provenance.job_name` (SI-229, lane
# L1a), which the obligation match compares with the CI job the obligations
# name, `verify` (plan R-CM-4). For a reusable workflow GitHub documents that
# "the github context is always associated with the caller workflow", which
# would make GITHUB_JOB the caller's job id; community reports show the
# called job's id instead. close-evidence.yml's caller job and this file's
# evidence job are both `verify`, so GITHUB_JOB is `verify` under either
# reading; internal/specalign pins both ids.
name: verify

on:
  push:
    branches-ignore:
      - "close/**"
    # Tag pushes keep running this workflow exactly as before the close/**
    # carve-out. With no branch or tag filter every tag push ran it, since
    # path filters are not evaluated for tag pushes; GitHub runs a workflow
    # that defines only branches/branches-ignore for no tag at all, so "**"
    # (every tag name) restores the old behaviour.
    tags:
      - "**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "e2e/**"
      - ".github/workflows/**"
      - "testdata/**"
      - "scripts/**"
      - "verdi.bindings.yaml"
  workflow_call: {}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # golangci-lint gate: cache then install the pinned linter (must match
      # Makefile's GOLANGCI_LINT_VERSION) so the lint step runs the real
      # linter. The cache key pins the version, so a hit restores the exact
      # binary and the install is a no-op; a miss builds it once.
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-v2.5.0
      - name: Install golangci-lint (pinned)
        run: |
          test -x "$(go env GOPATH)/bin/golangci-lint" || \
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make build
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: make lint-store
      - run: make lint-showcase
      - run: make showcase-coverage
      - run: go build -o .build/verdi ./cmd/verdi
      - run: ./.build/verdi lint

  test-cmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test-cmd

  test-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test-cross

  test-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test-rest
      # fixture re-runs three of test-rest's packages with test-rest's exact
      # flags, so here, after test-rest on the same runner, the Go test cache
      # replays them instead of executing them twice (SI-266).
      - run: make fixture

  spec-align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make spec-align

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Caches ~/.npm keyed on e2e/package-lock.json — actions/setup-node's
          # built-in npm cache. Does NOT cache the downloaded Playwright
          # browser binaries themselves (~/.cache/ms-playwright).
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: make e2e

  # The evidence job (SI-267; see the head comment). No `if:`: GitHub's
  # default success() skips this job unless every gate job it needs succeeded.
  # The verdict step re-checks every result, as a legible witness in this
  # job's log of the results the evidence binds.
  verify:
    needs: [static, test-cmd, test-cross, test-rest, spec-align, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Require every gate job to succeed
        run: scripts/merge-gate-verdict.sh e2e=${{ needs.e2e.result }} spec-align=${{ needs.spec-align.result }} static=${{ needs.static.result }} test-cmd=${{ needs.test-cmd.result }} test-cross=${{ needs.test-cross.result }} test-rest=${{ needs.test-rest.result }}
      - run: go build -o .build/verdi ./cmd/verdi
      - name: "Produce the CI-provenance evidence bundle (source: ci), incl. verdi's own self-hosted static/behavioral evidence"
        run: ./.build/verdi sync --produce
      - uses: actions/upload-artifact@v4
        with:
          name: verdi-evidence
          path: .verdi/data/derived/
          if-no-files-found: error
