# close-evidence (R-CM-4, docs/superpowers/plans/2026-09-22-closing-
# machinery.md; spec/remote-and-ci DC-1: evidence "is authoritative solely
# because it is fetched from the forge artifact store by (ref, commit),
# never because the flag was passed"): every push to a close/** branch must
# get exact-commit evidence with NO path filter — 03 §Closure ritual's
# closure gate (cmd/verdi/close.go -> runClosureGate ->
# internal/evidence.Fold) folds only source: ci records, and a
# path-filtered miss on the commit being closed would leave it nothing
# fresh to fold regardless of what that commit changed.
#
# GitHub Actions offers no per-branch conditional filter inside ONE push
# trigger — a single `on: push:` block's `branches`/`paths` filters apply
# uniformly to every ref they match, so "path-filtered everywhere except
# close/**, unfiltered on close/**" cannot be expressed in verify.yml's own
# trigger alone. This is therefore a second, tiny workflow, push-triggered
# on close/** ONLY, with no paths: filter at all, whose one job calls
# verify.yml's own `verify` job through `workflow_call`
# (jobs.<job_id>.uses) instead of copying its steps. Reusing the SAME job
# body matters for two reasons, not just economy:
#
#   - The self-hosted evidence producer (cmd/verdi/selfevidence.go) binds
#     verdi's own make-verify outcome as static/behavioral evidence, and is
#     only honest when `verdi sync --produce` runs strictly AFTER `make
#     verify` already exited 0 in the SAME job (verify.yml's own head
#     comment) — never a second, independent run that could disagree with
#     the first.
#   - verify.yml's OWN push trigger now excludes close/** via
#     `branches-ignore` (see its head comment), which makes it structurally
#     impossible for this workflow and verify.yml to BOTH upload a
#     "verdi-evidence" artifact for the same commit — two candidates would
#     otherwise be ambiguous (internal/forge/github's FetchEvidenceBundle
#     walks successful runs for a commit in API order and accepts
#     whichever carries that artifact name first).
#
# GITHUB_JOB inside a job invoked through `workflow_call` reports the
# CALLED workflow's own job id — "verify" — never this file's caller job
# id, so `provenance.job` (03 §Evidence records: "the pilot obligations
# name CI job `verify`, so the per-test records come from that job") is
# unaffected by being invoked this way (verified against GitHub's own
# reusable-workflows documentation and community-confirmed runtime
# behavior; see this lane's report for the exact citations).
#
# The caller job below declares only `uses:` and `permissions:`. GitHub's
# documented keyword whitelist for a job that calls a reusable workflow is
# name/uses/with/secrets/strategy/needs/if/concurrency/permissions/
# cache-mode; `environment:` is not among them, so this job (which needs
# no approval; it only produces evidence) cannot and does not declare one.
# The close.yml workflow's own close job is the one that declares
# `environment: close`.
#
# permissions: GitHub documents that when the calling job does not specify
# jobs.<job_id>.permissions, the called workflow gets the default
# GITHUB_TOKEN permissions, and a called workflow can only downgrade what
# it is passed. The called verify job needs contents: read and nothing
# else: actions/checkout reads the repository (the scope its README
# recommends), `verdi sync --produce` never dials the forge (sync.go), no
# step of verify.yml is given the token, and actions/upload-artifact
# authenticates with the runner's ACTIONS_RUNTIME_TOKEN rather than
# GITHUB_TOKEN. Every unlisted scope is set to none, so the token checkout
# persists in .git/config for later steps is read-only.
name: close-evidence

on:
  push:
    branches:
      - "close/**"

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
