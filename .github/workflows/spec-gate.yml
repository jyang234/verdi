# spec-gate (Phase 4, spec-only vs code CI differentiation; owner
# request mirroring the round-4 two-tier gate): the FAST push-side check
# for spec/doc-only changes. It produces no evidence bundle and uploads no
# artifact — evidence production is verify.yml's duty alone; this workflow
# only checks. verify.yml is path-filtered to code paths only, so a push
# that touches only `.verdi/specs/**`, `docs/**`, or a bare `.md` file
# never triggers it — this workflow covers exactly that case instead, so a
# spec/doc-only push still gets a check rather than none. (That is all the
# two path filters guarantee between them: a push touching neither filter
# set — say `examples/**` or `LICENSE` alone — triggers neither workflow.)
# It intentionally
# runs a light check only (build + `verdi lint` + `make spec-align`), never
# the full `make verify` (no unit tests, no e2e) — that's the whole point
# of the split: spec pushes gate on lint/readiness, code pushes pay the
# full gate. A push touching both code and spec paths triggers BOTH
# workflows, since verify.yml's own path filter still matches it.
#
# No branch protection / required-check wiring here: a path-filtered
# required check can never report on a PR outside its paths, which would
# deadlock a solo operator who can't also satisfy a required-approval
# quorum. That deadlock is exactly why PR gating was moved off this
# workflow (and off verify.yml) entirely: Task 8
# (spec/merge-signaled-acceptance) introduced merge-gate.yml — an
# unconditional, unfiltered pull_request workflow — as the one stable
# required PR check. This workflow no longer declares a `pull_request`
# trigger at all; it is push-only now, same as verify.yml.
name: spec-gate

on:
  push:
    paths:
      - ".verdi/specs/**"
      - "docs/**"
      - "**/*.md"

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build -o .build/verdi ./cmd/verdi
      - run: ./.build/verdi lint
      - run: make spec-align
