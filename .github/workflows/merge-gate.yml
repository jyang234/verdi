# Task 8 (spec/merge-signaled-acceptance): THE one stable pull-request gate.
# The ratified merge-signals design's enforcement boundary — the single
# required status check the branch ruleset points at (context
# "merge-gate", once step 6 of that plan's rollout activates it; see the
# plan's own task list — that activation is deliberately NOT this file's
# job).
#
# Always-present by design, on purpose, with NO paths/branches filter:
# spec-gate.yml's earlier head comment named the exact deadlock a
# path-filtered required check creates — "a path-filtered required check
# can never report on a PR outside its paths", which for a solo operator
# who can't also satisfy a required-approval quorum is a hard deadlock, not
# a corner case. verify.yml and spec-gate.yml are BOTH path-filtered (code
# paths vs spec/doc paths respectively), which is exactly why neither of
# them can be the required check: any PR touching neither path set would
# never get a check to satisfy, and a PR touching only one path set would
# leave the other's context permanently missing/pending. This workflow
# fixes that by running on every single pull_request, unconditionally — no
# changed-file classifier, no third-party path-filter action, no
# concurrency-cancellation cleverness. Any of those could make the required
# context disappear or turn ambiguous for some PR shape; the whole point of
# this file is to be the one context that is NEVER ambiguous about whether
# it will report.
#
# Parallel shape (SI-266, owner directive 2026-09-24). The gate is exactly
# `make verify`'s step set plus the post-verify self-lint (`go build` the
# binary, then `verdi lint` in the pull-request context, which exercises
# I-14's CI-context lint baselines against a real GITHUB_BASE_REF), split
# across parallel gate jobs so the wall clock is the slowest job, not the
# sum:
#   static      build, fmt-check, vet, lint, fixture, lint-store,
#               lint-showcase, showcase-coverage, then the self-lint;
#   test-cmd    the cmd/verdi test shard;
#   test-cross  the cross-binary test shard (always fresh, ADJ-68);
#   test-rest   every other package's tests;
#   spec-align  internal/specalign, the one gate that runs it;
#   e2e         the Playwright suite.
# Each gate job repeats the setup the single job had (full-history
# checkout, Go 1.25, Node 22 where e2e runs, the pinned golangci-lint where
# lint runs), carries no `name:`, `if:`, or `continue-on-error:`, and runs
# each make step as its own exact `run:` command.
#
# The required context is the `merge-gate` job alone: job key `merge-gate`,
# no `name:` override, so GitHub reports it as exactly "merge-gate". It
# `needs:` every gate job and runs with `if: always()` — without that, a
# failed gate job would make GitHub SKIP it, and a skipped required check
# does not block a merge. Its one decision is scripts/merge-gate-verdict.sh,
# which fails unless every gate job's result is `success`: a failed,
# cancelled, or skipped job, or a job missing from `needs:` (its result
# expands to ""), fails the required context.
#
# internal/specalign/workflow_test.go is the parity guard for all of this:
# the gate jobs run exactly VERIFY_STEPS (with `test` as its shards) plus
# the post-verify steps, each once; `merge-gate` needs exactly the gate
# jobs, with `if: always()` and the pinned verdict call; and every document,
# job, and step key is whitelisted. Change this file and the Makefile's
# VERIFY_STEPS together.
#
# Evidence production/upload is deliberately NOT here. That stays
# verify.yml's push-only duty (see verify.yml's own head comment on why
# evidence must be produced strictly after a make-verify run that already
# gated the SAME commit on push, never a second independent PR-triggered
# run of it) — this workflow exists to gate merges, not to produce or
# upload the "verdi-evidence" artifact.
name: merge-gate

on:
  pull_request: {}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # golangci-lint gate: cache then install the pinned linter (must match
      # Makefile's GOLANGCI_LINT_VERSION) so the lint step runs the real
      # linter. The cache key pins the version, so a hit restores the exact
      # binary and the install is a no-op; a miss builds it once.
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-v2.5.0
      - name: Install golangci-lint (pinned)
        run: |
          test -x "$(go env GOPATH)/bin/golangci-lint" || \
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make build
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: make fixture
      - run: make lint-store
      - run: make lint-showcase
      - run: make showcase-coverage
      - run: go build -o .build/verdi ./cmd/verdi
      - run: ./.build/verdi lint

  test-cmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test-cmd

  test-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test-cross

  test-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test-rest

  spec-align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make spec-align

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Caches ~/.npm keyed on e2e/package-lock.json — actions/setup-node's
          # built-in npm cache. Does NOT cache the downloaded Playwright
          # browser binaries themselves (~/.cache/ms-playwright).
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: make e2e

  merge-gate:
    needs: [static, test-cmd, test-cross, test-rest, spec-align, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every gate job to succeed
        run: scripts/merge-gate-verdict.sh e2e=${{ needs.e2e.result }} spec-align=${{ needs.spec-align.result }} static=${{ needs.static.result }} test-cmd=${{ needs.test-cmd.result }} test-cross=${{ needs.test-cross.result }} test-rest=${{ needs.test-rest.result }}
