# close (R-CM-4, docs/superpowers/plans/2026-09-22-closing-machinery.md;
# 03 §Closure ritual step 1: "Author (or a manually triggered CI job) runs
# `verdi close <story>`"): the dispatch-only CI job that actually runs the
# closure ritual. `workflow_dispatch` only — never `push`, never
# `pull_request` — because this job commits an archive-move to a branch and
# publishes a rollup to the tracker (04 §Semantics: "PublishRollup runs in
# CI only"), an act that must be a deliberate, named, human-triggered
# event, never an automatic reaction to a push.
#
# LANDED: lane L3b, closure condition 4 (SI-231, owner decision D4).
# Condition 4 of the closure gate (condition 6 for a feature,
# cmd/verdi/closuregate.go) accepts either of two shapes. One is the living,
# uncommitted deviation-report.md whose `covers` equals HEAD, which a CI
# checkout never has. The other is the committed one-behind report this
# sequence produces: HEAD has exactly one parent, HEAD's commit changes
# nothing but that spec's deviation-report.md, the report's `covers` is
# HEAD's parent, it is not frozen, every finding is dispositioned, and the
# working-tree report is byte-identical to the committed one. A CI checkout
# meets that last clause unless .gitattributes applies a checkout
# conversion to the report (eol, ident, working-tree-encoding, or a smudge
# filter; this repository's .gitattributes applies none); then close stops
# at condition 4 naming the clause (it fails closed). When every clause
# holds, close freezes that committed report in place.
#
# LANDED: lanes L2a, L2b and L2c, the close countersign (SI-230, SI-233,
# SI-235, SI-236). `verdi close` resolves the countersign at HEAD before it
# cuts its branch (cmd/verdi/close.go). On this detached checkout it takes
# the pull request's source branch from the shared validated CI ref
# (SI-257, lanes E4a and E4c, internal/repositoryfacts): GITHUB_REF_NAME,
# accepted only with GITHUB_REF_TYPE=branch and only when the exact ref
# refs/remotes/origin/<name> (read with `git show-ref --verify`) equals
# HEAD, which the fetch-depth: 0 checkout provides. That is
# close/<name> when the operator dispatches from that branch (L2a).
# Under a solo profile whose kernel permits the author/approver collapse
# (SI-233), it also reads THIS run's review in the `close` environment as
# the solo approval (L2c, through L2b's GitHub environment-review adapter
# in internal/forge): the run id and attempt come from GITHUB_RUN_ID
# and GITHUB_RUN_ATTEMPT, and the environment and the gated job are both
# pinned to `close` (internal/lifecyclecountersign/environmentreview.go),
# which is why this job's id is `close` and it declares no job-level
# `name:` (cmd/verdi's TestCloseWorkflowPinsTheEnvironmentReviewQuery pins
# both). Only a run's first attempt counts, so a retry is a new dispatch,
# never a re-run, and a solo owner can approve only if the environment
# allows self-review (spec/vatc-forge-countersign-v2 ac-4, dc-5). The
# countersign only reads: it never requests, creates or writes an
# approval, and this file reads no approval itself.
#
# PREREQUISITES STILL OPEN. No close can pass in this repository today.
# The countersign reads unproven, because .verdi/verdi.yaml carries no
# `countersign:` block and no governance profile is adopted
# (internal/lifecyclecountersign/resolve.go). Lane L4 (R-CM-5: store
# adoption, an owner ritual; plan §Lanes) would add both: an adopted solo
# profile that maps the `author` role and the close approver role
# (`story-review` or `feature-uat`) to the owner through a forge trust
# source and names a `close` transition, plus the verdi.yaml
# `countersign:` block. L4 is HELD by ruling R-W1-12, because adoption
# turns on the constitutional conflict gate for every close, and under
# current authority that gate cannot pass here:
#   (a) `verdi close` then requires `--context-request`. RESOLVED by
#       SI-252 and SI-258: this job always passes it. The step before the
#       close fills the committed, reviewed template
#       .github/verdi/close-context-request.json (adapter codex version 1,
#       phase review, the empty grant set, scope phases [review]) with the
#       validated spec ref and nothing else, into
#       .build/close-context-request.json. Dispatch inputs cannot supply
#       the adapter, grants or scope, and `verdi close` computes the
#       expected repository itself. On a store that is not adopted, which
#       this one is today, `verdi close` refuses `--context-request`
#       (cmd/verdi/conflictgate.go, probeConflictGate) and exits 2 before
#       any gate, branch cut or publication, so this job fails at its close
#       step there; no close can pass there today in any case, because the
#       countersign is unconfigured;
#   (b) the starter constitution registers no harness adapter that a
#       request could name;
#   (c) this detached checkout has no current branch. RESOLVED for the
#       branch checks by SI-257 (lanes E4a and E4c): the conflict gate's
#       expected branch, the compiler's stage-3 comparison, the
#       countersign's source branch and the conflict evaluator's
#       reverification (internal/policyconflict, reverifyConflictView)
#       all read the branch being closed from the validated CI-ref fact.
#       When that fact supplies the branch, the compiler seals it with the
#       operands it compiles, and the reverification reads it from there.
#       The fact's remote-tracking check reads exactly the ref
#       refs/remotes/origin/<name> (`git show-ref --verify`), never through
#       rev-parse's lookup rules. Only the branch reading is resolved: the
#       review-phase conflict gate is still held by (f). Every review-phase
#       report discloses (f)'s three review inputs as unproven, and those
#       disclosures block, so the gate's verdict is never pass;
#   (d) the conflict gate's judge (`align.judge_cmd`) would run on the CI
#       runner (THE JUDGE below);
#   (e) disposition approvers cannot be authenticated in CI;
#   (f) the review-phase conflict gate is blocked-unproven by three v1
#       review inputs (builder receipt, evidence bundle, result diff) that
#       only sealed-execution receipts and a review-capsule widening, not
#       yet built, could supply;
#   (g) with a countersign configured on an adopted store, `verdi close
#       --prepare` resolves the countersign before it refreshes the report
#       and exits 1 while no approval exists (under solo, none can exist
#       before the close run), so step 1 below cannot run there.
# Ruling R-W1-12 and the owner decisions it waits on are recorded in
# docs/superpowers/reports/2026-09-22-closing-machinery-wave-1.md.
#
# THE OPERATOR SEQUENCE. <name> is the spec being closed. H is the audited
# commit: the commit the deviation report covers, where the spec is still
# active and accepted-pending-build. The close runs at R, the one-behind
# report commit step 1 makes on top of H: the evidence records, the
# countersign candidate (the closure pull request's head, which must equal
# the local HEAD, and for a solo environment-review approval the close
# run's head too; v2 dc-3, ac-4) and the published rollup all bind R,
# while the frozen report covers H.
#
#   1. Prepare the report on the close branch, locally. Create close/<name>
#      at H (`git checkout -b close/<name> H`). <name> must be exactly the
#      spec's name, because `verdi close` cuts a branch of that name itself.
#      Bring the living deviation-report.md up to date for H: on this branch
#      that is `verdi close --prepare spec/<name>`, which takes the spec as
#      an argument and writes the report through the same align engine;
#      bare `verdi align` infers its spec only from a feature/<name> branch
#      and refuses close/<name> with exit 2. Disposition every finding in
#      deviation-report.md. Then commit deviation-report.md as the ONLY
#      change. That commit, R, has H as its only parent. The dispositions
#      reach the CI runner only as R's committed content, so a later change
#      to the report must be folded into R itself (amend R); a new commit on
#      top would no longer cover its parent. After R is committed,
#      re-running `--prepare` on this branch is safe only when every finding
#      in R's report is dispositioned AND the working-tree
#      deviation-report.md is byte-identical to R's. Then `verdi close
#      --prepare`'s shared align engine recognizes R as a committed
#      one-behind report (SI-231) and reports it current, leaving the file
#      untouched. In any other state it treats the report as stale and
#      regenerates it, which can discard dispositions (it names which).
#   2. Push the close branch (`git push -u origin close/<name>`). The push
#      triggers close-evidence.yml, which runs verify.yml's `verify` job
#      with no path filter: `make verify`, then `verdi sync --produce`, then
#      the upload of the `verdi-evidence` artifact for R.
#   3. Open the closure pull request from close/<name> to the default
#      branch, with R as its head. The countersign reads this pull request
#      (LANDED above), so it must be open before the dispatch.
#   4. After the close-evidence.yml run for R has completed successfully,
#      dispatch this workflow from close/<name>: `gh workflow run close.yml
#      --ref close/<name> -f spec_ref=spec/<name>`, or "Run workflow" on
#      that branch in the Actions UI. spec_ref must be exactly spec/<name>:
#      a tracker ref such as jira:LOAN-1482 is no longer accepted, because
#      the context request the close step passes binds a spec ref (SI-258).
#      Dispatching from that branch is what
#      makes github.sha equal R. The job's `verdi sync` lists only
#      completed, successful runs, so an earlier dispatch finds no bundle
#      for R and falls back to the nearest ancestor's bundle, if any,
#      instead of R's exact-commit evidence.
#   5. Approve the run in the `close` environment. The close job declares
#      `environment: close`, a protected environment the owner configures
#      with required reviewers; GitHub holds the job before its first step
#      until a reviewer approves. The job then validates the input, checks
#      out R detached, pulls R's evidence with `verdi sync`, fills the
#      context-request template with the spec ref, runs `verdi
#      close` (the gate, the freeze in place, the archive move, the archive
#      commit on a local close/<name>, and the publication), and pushes
#      close/<name> to origin. The push fast-forwards close/<name> from R to
#      the archive commit, which updates the pull request.
#   6. Merge the closure pull request (03 §Closure ritual step 4: "merging
#      it *is* closure"). The archive commit was pushed with the job's
#      GITHUB_TOKEN, and GitHub creates no push-triggered run for such a
#      push, so close-evidence.yml does not run on it. For the updated pull
#      request GitHub creates the merge-gate run in an approval-required
#      state: a user with write access selects "Approve workflows to run"
#      so merge-gate reports on the archive commit before the merge.
#
# WHY `verdi sync` (not `--produce`) here: this job only ever PULLS the
# bundle close-evidence.yml already produced and uploaded for the exact
# commit on close/<name> (internal/forge's fetch-by-(ref,commit) path,
# cmd/verdi/sync.go's runSync) — it never re-produces evidence itself, which
# would be a second, independent, non-CI-gated claim about the same commit.
# Evidence is authoritative only because it is fetched from the forge
# artifact store by (ref, commit) (spec/remote-and-ci DC-1, plan R-CM-4).
#
# WHY checkout pins `ref: ${{ github.sha }}`: see that step's own comment.
# In short, the DEFAULT (ref: omitted) checkout of a branch-name ref
# creates a LOCAL branch of that same name, which collides with `verdi
# close`'s own `git checkout -b close/<name>` branch cut (git refuses `-b`
# on an existing branch name); pinning to the commit SHA checks out
# detached instead, avoiding the collision entirely. The detached HEAD has
# no current branch, which is why the countersign, the conflict gate's
# expected branch, the compiler's stage-3 comparison and the conflict
# evaluator's reverification read the branch being closed from the
# validated CI ref (LANDED above; PREREQUISITES (c)). fetch-depth: 0
# fetches all history for all branches (actions/checkout's README;
# documented, no live run has exercised it yet), which gives the runner the
# refs/remotes/origin/close/<name> that the CI-ref validation compares
# with HEAD.
#
# permissions: is the least-privilege set this exact sequence needs, and
# nothing else (unlisted scopes default to "none" once permissions: is
# specified at all):
#   - contents: write   — actions/checkout, and this job's own final `git
#     push` of the close/<name> branch (verdi close never pushes itself).
#   - actions: read     — `verdi sync`'s forge round trip: GitHub's Actions
#     API to list workflow runs for the commit, list that run's artifacts,
#     and download the "verdi-evidence" artifact
#     (internal/forge/github/github.go: GET .../actions/runs,
#     .../actions/runs/{id}/artifacts, .../actions/artifacts/{id}/zip).
#     Under a solo collapse the countersign also reads this run, its
#     attempt's jobs, the `close` environment, and the run's review
#     history (internal/forge/github/environmentreview.go: GET
#     .../actions/runs/{id}, .../actions/runs/{id}/attempts/{n}/jobs,
#     .../environments/close, .../actions/runs/{id}/approvals). GitHub's
#     REST docs list all four under Actions read (documented; no live run
#     has exercised them yet).
#   - pull-requests: read — cmd/verdi/closuregate.go's
#     checkPendingSupersessionCondition, called unconditionally inside
#     `verdi close`'s closure gate, discovers the spec's open MR via
#     forge.FindOpenMR (GET .../pulls); without this scope that call
#     degrades to a disclosed-unproven condition rather than a proven one.
#     The countersign uses it too: it finds the closure pull request and
#     reads its head and reviews (internal/forge/github/approval.go: GET
#     .../pulls, .../pulls/{n}, .../pulls/{n}/reviews).
# No other GITHUB_TOKEN scope is used by this sequence, so these three
# suffice. The tracker PublishRollup step (the round-6 hermetic fake
# provider by default, per .verdi/verdi.yaml's providers.jira.mode: fake)
# is not a GitHub API call and needs no scope here.
#
# THE JUDGE. `align.judge_cmd` (.verdi/verdi.yaml) runs in step 1's local
# report refresh. While the store is not adopted, this job never calls it:
# there `verdi close` refuses the job's `--context-request` before any
# gate (PREREQUISITES (a)). Nor does the close's own report step: it
# freezes the committed report in place (SI-231, lane L3b),
# and the freeze-in-place path (cmd/verdi/align.go, runAlignForSpec)
# returns before any judge call. Any other report shape stops the job at
# condition 4, before any freeze. The runner therefore needs no judge
# binary or credentials only while the store is not adopted; once it is,
# the conflict gate would run the judge here (PREREQUISITES (d)).
#
# PUBLICATION PRECEDES THE PUSH. `verdi close` publishes the rollup to
# the tracker (cmd/verdi/close.go, PublishRollup) before this job's final
# `git push`. If that push is rejected, because close/<name> moved on
# origin after `verdi close` read the countersign (for example an operator
# push while the job runs), the job fails with the rollup already
# published for R, and the archive commit exists only on the runner, which
# discards it. (A push during the approval wait moves the pull request's
# head before the job starts, so the countersign finds that head unequal
# to R and nothing is published.) Origin is unchanged: the spec is still
# active there, and the closure pull request shows whatever close/<name>
# now holds. The operator then does NOT merge that pull request. They put
# close/<name> back into the shape step 1 describes (one commit whose only
# change is the dispositioned deviation-report.md, on top of H), wait
# for that commit's evidence run, and dispatch and approve again. The new
# run publishes again; PublishRollup is idempotent on (story, commit)
# (internal/provider/port.go), so republishing the same commit updates the
# earlier publication rather than duplicating it.
name: close

on:
  workflow_dispatch:
    inputs:
      spec_ref:
        description: >-
          The exact spec ref to close: spec/<name>, and nothing else. A
          scheme-prefixed tracker ref such as jira:LOAN-1482 is refused,
          because the context request this job passes to the close binds a
          spec ref (SI-258); any other value is refused too, before any
          verdi verb runs. Dispatch this workflow FROM the close/<name>
          branch the operator already pushed and waited for evidence on
          (see this file's header comment).
        required: true
        type: string

# One close run per spec ref at a time. GitHub's documented concurrency
# behaviour: a run queued while another run in the same group is in
# progress waits as `pending`, and a newer queued run cancels an older
# pending one. cancel-in-progress: false means a running close is never
# cancelled, because it may already have published and not yet pushed
# (see PUBLICATION PRECEDES THE PUSH above). The group is keyed on the
# input text. Only an exact spec/<name> value passes validation (tracker
# refs are refused, SI-258), so every run that gets past validation for a
# spec is in that spec's one group.
concurrency:
  group: close-${{ inputs.spec_ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    environment: close
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      # The input reaches the shell only as the env value SPEC_REF, never
      # as `${{ inputs.spec_ref }}` inside run: text: the runner substitutes
      # an expression into the script before the shell starts, so an
      # interpolated input would run as code before this check. printf %q
      # prints a rejected value with any newline escaped, so it cannot
      # start a workflow command of its own. Only spec/<name> is accepted
      # (SI-258): the context request the close step passes binds a spec
      # ref, which a tracker ref cannot fill.
      - name: Validate spec_ref before running any verdi verb
        env:
          SPEC_REF: ${{ inputs.spec_ref }}
        run: |
          spec_re='^spec/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ "$SPEC_REF" =~ $spec_re ]]; then
            exit 0
          fi
          printf '::error::spec_ref %q is not a spec ref (spec/<name>); a tracker ref such as jira:LOAN-1482 is refused because the context request the close step passes to the conflict gate binds a spec ref (SI-258); refusing before running any verdi verb\n' "$SPEC_REF"
          exit 1
      - uses: actions/checkout@v4
        with:
          # Pinned to the exact commit SHA, not the branch name, so the
          # checkout lands DETACHED rather than on a local branch named
          # close/<name>: actions/checkout's input-helper.ts routes a
          # 40/64-hex `ref:` value into `settings.commit` with
          # `settings.ref` cleared, and its git-command-manager.ts
          # `checkout()` then runs a plain `git checkout --progress
          # --force <sha>` — no local branch created. The DEFAULT (ref:
          # omitted) instead resolves `github.ref` =
          # "refs/heads/close/<name>" and runs `git checkout --progress
          # --force -B close/<name> refs/remotes/origin/close/<name>",
          # which DOES create a local branch named close/<name> — and
          # `verdi close`'s own branch cut (gitx.CheckoutNewBranch, `git
          # checkout -b close/<name>`) uses `-b`, which refuses outright
          # if a branch of that name already exists. Pinning to
          # github.sha is what makes the ritual's own branch cut succeed.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build -o .build/verdi ./cmd/verdi
      - name: Pull evidence for the exact commit being closed (verdi sync — never --produce; the forge artifact-store round trip DC-1 requires)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.build/verdi sync
      # SI-252, SI-258: the context request comes from the committed,
      # reviewed template .github/verdi/close-context-request.json, which
      # holds the adapter, the grants, the phase and the scope. This step
      # sets its spec, and nothing else, from the validated input, which
      # reaches it only as env SPEC_REF, so a dispatch input cannot supply
      # the adapter, grants or scope. jq -c -S writes the canonical encoding
      # `verdi close` requires (internal/specalign pins the template and
      # explains why). The output lands in .build/, which is git-ignored and
      # lies under the checkout root, so the request-path check stops at the
      # store root. jq is preinstalled on GitHub-hosted Ubuntu runner images
      # (documented; no live run has exercised this step yet).
      - name: Fill the committed context-request template with the validated spec ref
        env:
          SPEC_REF: ${{ inputs.spec_ref }}
        run: jq -c -S --arg spec "$SPEC_REF" '.spec = $spec' .github/verdi/close-context-request.json > .build/close-context-request.json
      # `verdi close` commits the archive move with a bare `git commit`
      # (internal/gitx.CreateCommit), and a runner has no global git
      # identity, so this step gives git the GitHub Actions bot identity
      # (the values actions/checkout's README uses for pushing with the
      # built-in token) for both author and committer. They live in this
      # step's environment only.
      - name: Run the close ritual (gate, freeze, archive move, commit, publish) — never --force-local
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_REF: ${{ inputs.spec_ref }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: ./.build/verdi close "$SPEC_REF" --context-request .build/close-context-request.json
      - name: "Push the close/<name> branch verdi close committed to (dc-3: the verb stops at the branch; this job's own push is what makes the closure MR possible)"
        run: git push origin HEAD
